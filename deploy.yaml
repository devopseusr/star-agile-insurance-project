apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-app
  labels:
    app: insurance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insurance
  template:
    metadata:
      labels:
        app: insurance
    spec:
      containers:
        - name: insurance-container
          image: archana035/insurance_repo:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:h2:mem:testdb
            - name: SPRING_H2_CONSOLE_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: insurance-service
spec:
  type: NodePort
  selector:
    app: insurance
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30082  # You can change this to any available port between 30000-32767
